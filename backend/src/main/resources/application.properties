spring.application.name=trust-agro-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/trust_agro_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for development
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=TrustAgroSecretKey2024VeryLongSecretKeyForJWTSigning
app.jwt.expiration=86400000

# Server
server.port=${SERVER_PORT:8081}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}

# Alerts
app.alerts.mortality-threshold=5.0
app.alerts.expiry-warning-days=30

# SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:user}
spring.mail.password=${SMTP_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.3

# OTP Configuration
app.otp.signup.expiry-minutes=10
app.otp.login.expiry-minutes=5
app.otp.length=6

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8081/realms/trust-agro/protocol/openid-connect/certs}
keycloak.server-url=${KEYCLOAK_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:trust-agro}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_SECRET:secret}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
